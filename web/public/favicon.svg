<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="55%" stop-color="#A21CAF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Hexagon ring (LLM token / embedding hissi) -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.85"/>
  <!-- Inner node dots -->
  <circle cx="32" cy="18" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="48" cy="26" r="2.5" fill="#10B981"/>
  <circle cx="48" cy="38" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="32" cy="46" r="2.5" fill="#EC4899"/>
  <circle cx="16" cy="38" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="16" cy="26" r="2.5" fill="#10B981"/>
  <!-- Central glyph: { } -->
  <text x="32" y="40" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#FFFFFF">{...}</text>
</svg>
